name: Deploy to AWS (ECS Fargate)

# Manual deployment. Configure repository variables:
#   AWS_REGION, AWS_DEPLOY_ROLE_ARN, ECS_CLUSTER, ECS_API_SERVICE, ECS_WEB_SERVICE,
#   ECS_MIGRATION_TASK_DEFINITION (optional one-off task), ECS_SUBNETS, ECS_SECURITY_GROUP,
#   SITE_URL, API_INTERNAL_URL, MEDIA_URL
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push API image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/hikeup-api:${{ github.sha }}
          docker build -f docker/api/Dockerfile -t $IMAGE .
          docker push $IMAGE
          echo "API_IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Build & push web image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/hikeup-web:${{ github.sha }}
          docker build -f docker/web/Dockerfile \
            --build-arg API_INTERNAL_URL=${{ vars.API_INTERNAL_URL }} \
            --build-arg NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }} \
            --build-arg STORAGE_PUBLIC_BASE_URL=${{ vars.MEDIA_URL }} \
            -t $IMAGE .
          docker push $IMAGE
          echo "WEB_IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Run database migrations (one-off task)
        if: vars.ECS_MIGRATION_TASK_DEFINITION != ''
        run: |
          aws ecs run-task --cluster ${{ vars.ECS_CLUSTER }} --launch-type FARGATE \
            --task-definition ${{ vars.ECS_MIGRATION_TASK_DEFINITION }} \
            --network-configuration "awsvpcConfiguration={subnets=[${{ vars.ECS_SUBNETS }}],securityGroups=[${{ vars.ECS_SECURITY_GROUP }}]}" \
            --overrides '{"containerOverrides":[{"name":"api","image":"'"$API_IMAGE"'","command":["sh","-c","cd /app/database && npx prisma migrate deploy"]}]}' \
            --query 'tasks[0].taskArn' --output text > task.txt
          aws ecs wait tasks-stopped --cluster ${{ vars.ECS_CLUSTER }} --tasks $(cat task.txt)
          code=$(aws ecs describe-tasks --cluster ${{ vars.ECS_CLUSTER }} --tasks $(cat task.txt) --query 'tasks[0].containers[0].exitCode' --output text)
          test "$code" = "0"

      - name: Render & deploy API service
        id: api-td
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/aws/ecs-task-definition-api.json
          container-name: api
          image: ${{ env.API_IMAGE }}
      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.api-td.outputs.task-definition }}
          service: ${{ vars.ECS_API_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Render & deploy web service
        id: web-td
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/aws/ecs-task-definition-web.json
          container-name: web
          image: ${{ env.WEB_IMAGE }}
      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.web-td.outputs.task-definition }}
          service: ${{ vars.ECS_WEB_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true
