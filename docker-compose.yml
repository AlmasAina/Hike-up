# Local development stack: PostgreSQL, Mailpit (email testing), API and web.
#
#   cp .env.example .env            # adjust secrets
#   docker compose up -d --build
#   docker compose exec api sh -c "cd /app/database && npx tsx seed/seed.ts"
#
# Website http://localhost:3000 · API http://localhost:4000/api/v1 · Swagger http://localhost:4000/api/docs
# Mailpit inbox http://localhost:8025

name: hikeup

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hikeup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hikeup}
      POSTGRES_DB: ${POSTGRES_DB:-hikeup}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-hikeup} -d ${POSTGRES_DB:-hikeup}']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '8025:8025'
      - '1025:1025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-hikeup}:${POSTGRES_PASSWORD:-hikeup}@postgres:5432/${POSTGRES_DB:-hikeup}?schema=public
      WEB_URL: http://localhost:3000
      API_PUBLIC_URL: http://localhost:4000
      STORAGE_DRIVER: local
      UPLOAD_DIR: /app/uploads
      STORAGE_PUBLIC_BASE_URL: http://localhost:3000/uploads
      MAIL_TRANSPORT: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_SECURE: 'false'
      COOKIE_SECURE: 'false'
      RUN_MIGRATIONS: 'true'
    ports:
      - '4000:4000'
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        STORAGE_PUBLIC_BASE_URL: http://localhost:3000/uploads
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  api_uploads:
