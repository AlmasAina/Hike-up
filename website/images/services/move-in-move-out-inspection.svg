<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="move in move out inspection illustration">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3fb"/><stop offset="1" stop-color="#dfe8f6"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d6ea"/><stop offset="1" stop-color="#b3c3dc"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1b3d"/><stop offset="1" stop-color="#162c58"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc0f5"/><stop offset="0.7" stop-color="#cfe7fb"/><stop offset="1" stop-color="#f6e7c8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fc3ef"/><stop offset="0.5" stop-color="#3f79c4"/><stop offset="1" stop-color="#1d4fa3"/>
