# Production stack for a single server (e.g. one AWS EC2 instance):
# PostgreSQL + API + website + Caddy (automatic HTTPS with Let's Encrypt).
#
#   cp deploy/production.env.example .env      # then fill in every value
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Step-by-step guide: docs/AWS_EC2_DEPLOYMENT.md

name: hikeup

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      WEB_URL: https://${DOMAIN:?set DOMAIN in .env}
      API_PUBLIC_URL: https://${DOMAIN}
      CORS_ORIGINS: https://${DOMAIN}
      COOKIE_SECURE: 'true'
      STORAGE_DRIVER: local
      UPLOAD_DIR: /app/uploads
      STORAGE_PUBLIC_BASE_URL: https://${DOMAIN}/uploads
      RUN_MIGRATIONS: 'true'
      SWAGGER_ENABLED: 'false'
      LOG_FORMAT: json
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
        STORAGE_PUBLIC_BASE_URL: https://${DOMAIN}/uploads
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
  api_uploads:
  caddy_data:
  caddy_config:
